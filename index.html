<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baúl Semántico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="emseo.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 72px) clamp(16px, 4vw, 40px);
    display: flex; flex-direction: column; justify-content: center; }
  .intro { max-width: 640px; margin-bottom: 40px; }
  .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  a.app { display: flex; flex-direction: column; padding: 28px 28px 26px; color: inherit; text-decoration: none; position: relative;
    overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  a.app:hover, a.app:focus-visible { border-color: var(--ink); box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 18px 40px -14px rgba(16,24,40,.28); outline: none; }
  a.app h2 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin: 10px 0 6px; }
  a.app p { color: var(--ink-2); font-size: 15px; flex: 1; }
  a.app .btn { align-self: flex-start; margin-top: 28px; }
  .pie { margin-top: 36px; font-size: 13.5px; color: var(--muted); }
  @media (max-width: 700px) { .grilla { grid-template-columns: 1fr; } .intro { margin-bottom: 28px; } }
</style>
</head>
<body>
<header class="hdr">
  <img class="logo-ube" src="img/logo_ube.png" alt="Universidad Bolivariana del Ecuador">
</header>
<main>
  <div class="intro">
    <h1 class="titulo">Baúl Semántico</h1>
    <p class="sub" style="font-size:19px;color:var(--ink-2)">Evaluación de Memoria Semántica mediante Evocación Oral (EMSEO)</p>
  </div>
  <div class="grilla">
    <a class="card app" href="3_Digital_para_marcar.html">
      <span class="eyebrow">I</span>
      <h2>Digital para marcar</h2>
      <span class="btn">Abrir <span class="arr">&rarr;</span></span>
    </a>
    <a class="card app" href="4_Digital_para_escribir.html">
      <span class="eyebrow">II</span>
      <h2>Digital para escribir</h2>
      <span class="btn">Abrir <span class="arr">&rarr;</span></span>
    </a>
  </div>
</main>
</body>
</html>
